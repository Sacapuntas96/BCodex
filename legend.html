<!DOCTYPE html>

        <link id="stylesheet" rel="stylesheet" href="../Styles/Profile.css">

                    </div>
                    <div class="stats">

                    <div class="stats">

                    </div>
                    <div class="stats">
                        <p class="stat_name">Speed</p><p class="stat_value">1</p>
